[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimir-cultivate"
version = "0.9.11"
description = "Cultivate coding provider for Mimir"
requires-python = ">=3.11"
license = "BUSL-1.1"
dependencies = ["mimir-agent==0.9.11"]

[tool.uv.sources]
mimir-agent = { workspace = true }

[project.entry-points."mimir.plugins"]
cultivate = "mimir_cultivate:provider"

[tool.hatch.build.targets.wheel]
packages = ["mimir_cultivate"]
exclude = ["mimir_cultivate/defaults/skills/**", "mimir_cultivate/docker/**"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "mimir_cultivate/LICENSE"
"brand/LICENSE" = "mimir_cultivate/brand/LICENSE"
"mimir-plugin.toml" = "mimir_cultivate/mimir-plugin.toml"
"mimir_cultivate/defaults/skills" = "mimir_cultivate/defaults/skills"
"mimir_cultivate/defaults/skill_releases.json" = "mimir_cultivate/defaults/skill_releases.json"
"mimir_cultivate/frontend/cultivate.v1.js" = "mimir_cultivate/frontend/cultivate.v1.js"
"mimir_cultivate/frontend/cultivate.v1.css" = "mimir_cultivate/frontend/cultivate.v1.css"
"mimir_cultivate/skins/squashmerge.json" = "mimir_cultivate/skins/squashmerge.json"
"mimir_cultivate/brand/cultivate-logo-dark-v1.png" = "mimir_cultivate/brand/cultivate-logo-dark-v1.png"
"mimir_cultivate/docker" = "mimir_cultivate/docker"

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "LICENSE", "brand/LICENSE", "mimir-plugin.toml", "mimir_cultivate/**/*"]

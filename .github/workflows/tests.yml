name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege at the workflow level. First workflow in the repo →
# sets the template for everything that follows; explicit minimal scope
# is the right default. Individual jobs can opt UP if needed.
permissions:
  contents: read

# Cancel in-flight runs for the same ref when a new commit lands. Saves
# minutes on PR force-pushes; main-branch runs use ref=refs/heads/main
# so cancel-in-progress only fires on PR events.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    # Exercise the same source-distribution-first build used for releases. A
    # second, direct wheel catches file-selection differences between the two
    # paths before a tag reaches publish.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build React app
        run: |
          npm ci
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Build sdist and wheel from sdist
        run: uv build

      - name: Build wheel directly from checkout
        run: uv build --wheel --out-dir dist/direct

      - name: Verify wheel contents and build-path parity
        run: >-
          python .github/assert_wheel_contents.py
          --sdist-wheel dist/*.whl
          --direct-wheel dist/direct/*.whl

  skill-conformance:
    # Fast gate (<1s of pytest work). Surfaces a single status check
    # SKILL-authors can grep for on a PR. Closes the body-vs-declared
    # ``allowed-tools`` drift gap that pre-beta review flagged
    # (chainlink #82 sub #88). Runs first so the slower pytest matrix
    # below can fail-fast on conformance breaks via ``needs:``.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # Pin to a known-good minor — ``latest`` is a slow-motion
          # supply-chain risk + a reproducibility hole. Bump
          # deliberately with a code review, not silently.
          version: "0.11.12"
          # Cache uv's resolver state keyed on the lockfile. Heavy
          # deps (fastembed/faiss-cpu/aiohttp) reinstall on every run
          # without this — the 4m32s install time on the cold 3.12
          # run was almost entirely pip work.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies (with dev and bench extras)
        # ``--extra dev`` is required — plain ``uv sync`` skips
        # pytest-aiohttp (declared under [project.optional-dependencies].dev
        # in pyproject.toml) and other dev-only deps, which produces
        # cascading ``fixture 'aiohttp_server' not found`` errors.
        run: uv sync --extra dev --extra bench

      - name: Skill conformance + catalog tests
        run: uv run pytest tests/test_skill_conformance.py tests/test_skill_catalog.py -v

  chainlink-cli-audit:
    # Exercise the real pinned CLI help exactly once in CI. The full-suite jobs
    # intentionally skip these two live audits when Chainlink is absent; this
    # dedicated gate keeps upstream command drift executable without compiling
    # the Rust CLI three times across the Python/enforcement matrix.
    needs: skill-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (with dev and bench extras)
        run: uv sync --extra dev --extra bench

      - name: Install pinned Chainlink CLI
        # Keep this pin in sync with mimir/skills/chainlink/dockerfile.fragment.
        run: |
          cargo install \
            --git https://github.com/dollspace-gay/chainlink.git \
            --tag chainlink-1.6.0 \
            --root "$RUNNER_TEMP/chainlink" \
            chainlink-tracker
          echo "$RUNNER_TEMP/chainlink/bin" >> "$GITHUB_PATH"

      - name: Audit live Chainlink command surface
        run: |
          chainlink --version
          uv run pytest -q tests/test_access_control.py \
            -k 'chainlink_issue_help_has_an_explicit_read_or_mutation_decision or chainlink_top_level_help_has_an_explicit_scope_decision'

  pytest:
    # Full mimir test suite under py 3.11 + 3.12 matrix. ``needs:
    # skill-conformance`` makes the fast gate fail-fast PRs that bust
    # frontmatter, instead of waiting for the slower full matrix to
    # come back red on the same root cause.
    needs: skill-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (with dev and bench extras)
        # ``--extra dev`` is required — see skill-conformance job's
        # comment for the rationale.
        run: uv sync --extra dev --extra bench

      - name: Run mimir test suite
        # ``testpaths`` is set in pyproject.toml so no explicit path
        # arg needed. Excludes saga/saga/tests/ (workspace member's
        # nested test tree) and the mimir/optional-skills/ test trees
        # (each needs its own skill-dir conftest, and they collide on the
        # shared ``poller`` / ``tests.conftest`` module names). saga has
        # its own conftest; the optional-skills trees run in the dedicated
        # per-skill step below (chainlink #299).
        run: uv run pytest -q --tb=short

      - name: Run optional-skills tests (per-skill, isolated)
        # Each optional skill under mimir/optional-skills/ ships its own
        # poller.py + tests/conftest.py. Run together they collide
        # (ImportPathMismatchError on the shared ``tests.conftest`` module
        # name, plus duplicate ``poller`` modules), which is why the main
        # suite excludes them. Run each skill's tests in its OWN pytest
        # process so sys.modules starts fresh per skill. (chainlink #299)
        run: |
          set -e
          ran=0
          for tdir in mimir/optional-skills/*/tests; do
            if [ -d "$tdir" ]; then
              echo "== $tdir =="
              uv run pytest -q "$tdir"
              ran=$((ran + 1))
            fi
          done
          # chainlink #330: fail loudly if the glob matched no test dirs
          # (e.g. an optional-skills layout change) rather than passing
          # vacuously and silently dropping this coverage.
          if [ "$ran" -eq 0 ]; then
            echo "::error::no optional-skills test dirs matched mimir/optional-skills/*/tests"
            exit 1
          fi
          echo "ran optional-skills tests for $ran skill(s)"

  pytest-enforced:
    # The same suite with MIMIR_ACCESS_CONTROL_ENFORCED=1.
    #
    # Why this job exists: authorization regressions are invisible to the
    # unenforced matrix by construction. Every gate that fails closed only under
    # enforcement passes silently with the flag off, which is how #999, #1000 and
    # #1001 all reached main and had to be found by hand afterwards.
    #
    # MIMIR_MODEL_SPEC is deliberately LEFT UNSET so the run exercises the
    # shipped default (codex-plus:gpt-5.6-luna) — the configuration a fresh
    # install actually gets. That default is enforcement-compatible; a
    # claude-code: default used to fail startup preflight outright.
    #
    # One Python version is enough: enforcement behavior is not
    # version-specific, and the 3.11/3.12 matrix above already covers the
    # interpreter axis. No provider credentials are required — model resolution
    # is not exercised by the suite.
    #
    # A green run here means "nothing failed", NOT "enforcement is covered".
    # tests/test_env_isolation.py::test_no_test_is_skipped_because_enforcement_is_on
    # is what keeps those two the same claim, by failing if anyone silences an
    # enforced failure with a skipif on the flag.
    needs: skill-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (with dev and bench extras)
        run: uv sync --extra dev --extra bench

      - name: Run mimir test suite (enforcement on)
        env:
          MIMIR_ACCESS_CONTROL_ENFORCED: "1"
        run: uv run pytest -q --tb=short

  worklink-image-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"

      - name: Prove shipped Worklink identities and permissions
        run: uv run python scripts/worklink_image_identity.py

  claude-code-extra-smoke:
    # The claude-code extra is the permanent install path for Anthropic Max
    # subprocess deployments. Keep a focused CI smoke so a dependency/metadata
    # regression cannot hide behind the default dev-only sync.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies (with Claude Code extra)
        run: uv sync --extra dev --extra claude-code

      - name: Import adapter and verify Mimir enforcement hook
        run: |
          uv run python - <<'PY'
          import langchain_claude_code
          from mimir import _langchain_claude_code_patches as patches

          patches.assert_supported_langchain_claude_code_adapter(langchain_claude_code)
          patches.ensure_tool_enforcement_hooks_installed(langchain_claude_code)
          print("claude-code adapter smoke ok")
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build React app
        run: |
          npm run test
          npm run build
